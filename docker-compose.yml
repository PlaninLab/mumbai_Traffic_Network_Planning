# Mumbai Traffic Network Planning — deployment topology.
#
# Two containers from the ONE image (Dockerfile), sharing two named volumes:
#
#   web        read-only dashboard + report + JSON API. Holds no API key: the
#              app never calls a paid provider, so the public-facing container
#              has nothing to leak.
#   collector  the metered, one-off August campaign. Each scheduled sweep calls
#              every mapped MMRDA junction (which includes BMC) plus the 16 WEH
#              points and writes successful observations to SQLite.
#
# The volumes are the only shared state. Both must mount BOTH: the collector
# writes traffic.db and segment_overview.json, and the web service reads them.
#
# Secrets come from the platform's env, never from this file — ${HERE_API_KEY}
# interpolates at deploy time from the project's environment variables.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      TZ: Asia/Kolkata
      # Python block-buffers stdout when it is not a TTY, so a whole day of
      # collector diagnostics can sit unflushed in a 4-8 KB buffer. The first
      # deployment's log arrived in bursts an hour apart for exactly this
      # reason, which made a silent collector impossible to diagnose live.
      PYTHONUNBUFFERED: "1"
      # Keep usage visible in /data without imposing a client-side monthly cap.
      # No API key is present here, so the public container cannot spend anything.
      HERE_MONTHLY_CALL_LIMIT: "0"
      REGIONAL_COLLECTION_SCOPE: "mmrda"
      REGIONAL_COLLECTION_MODE: "fixed_august_2026_campaign"
    volumes:
      - traffic-data:/app/data/processed
      - traffic-csv:/app/data/raw/tomtom/collected
    # No container healthcheck. The one that was here never executed on the host
    # platform: across two container starts and two hours, uvicorn's access log
    # recorded not one request from 127.0.0.1, so the probe was failing before it
    # reached the app. Docker does not restart an unhealthy container by itself,
    # so its ONLY effect was to mark a service "failed" that was serving 200 over
    # HTTPS the whole time — a permanent false alarm, which is worse than no
    # check, because it hides the real one. /api/health is still there for an
    # external uptime monitor, and it reports collection state as well as
    # liveness (readings, budget_exhausted, provider_hold, collection_stopped).

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      # Python block-buffers stdout when it is not a TTY, so a whole day of
      # collector diagnostics can sit unflushed in a 4-8 KB buffer. The first
      # deployment's log arrived in bursts an hour apart for exactly this
      # reason, which made a silent collector impossible to diagnose live.
      PYTHONUNBUFFERED: "1"
      # HERE_API_KEY is deliberately NOT declared here. Declaring it as
      # ${HERE_API_KEY} would interpolate to an EMPTY STRING when the variable is
      # unset at deploy time, and that empty value would then shadow the key set
      # on the service in the platform UI — the collector would run key-less and
      # fail every sweep. Leaving it undeclared lets the platform inject it.
      # Set it on the `collector` service: Apps & Services -> collector -> Environment.
      #
      # Explicit zero means no client-side monthly cap. Calls are still metered
      # in traffic.db and provider failure/back-off protections remain active.
      HERE_MONTHLY_CALL_LIMIT: "0"
    volumes:
      - traffic-data:/app/data/processed
      - traffic-csv:/app/data/raw/tomtom/collected
    # Absolute one-off campaign in IST. It waits for 23:00 on 17 Aug, runs 16
    # 90-minute slots through 21:30 on 18 Aug, applies the requested 45-minute
    # phase offset, then runs 16 slots from 23:45 through 22:15 on 19 Aug. The
    # 23:15 hard stop prevents further calls even if the last sweep is slow.
    #
    # This calls all 2,003 MMRDA junctions plus the 16 existing WEH points:
    # exactly 2,019 planned calls per normal sweep. The expected-count guards
    # refuse all paid calls if either count differs. Durable slot claims prevent
    # replay on restart; --stay-alive prevents Docker relaunching the closed
    # campaign after it ends.
    command: "python -m src.data.collect_campaign --campaign mmrda_20260817_48h_offset45 --start 2026-08-17T23:00:00+05:30 --stop 2026-08-19T23:15:00+05:30 --interval-minutes 90 --offset-after-hours 24 --offset-minutes 45 --expected-junctions 2003 --corridor-points 16 --expected-calls-per-sweep 2019 --late-grace-minutes 5 --scope mmrda --provider here --stay-alive"

volumes:
  traffic-data:
  traffic-csv:
